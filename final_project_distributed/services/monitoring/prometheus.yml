# Prometheus — cloud (docker-compose). Agent A runs as N replicas of the
# `agent-system-a` service; DNS service discovery returns one address per replica,
# so new replicas are scraped automatically when the service is scaled.

global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["gateway-log-exporter:4040"]

  - job_name: gateway-nginx
    static_configs:
      - targets: ["gateway-nginx-exporter:9113"]

  - job_name: agent-a
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["agent-system-a"]
        type: A
        port: 8000
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__address__]
        target_label: replica

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
