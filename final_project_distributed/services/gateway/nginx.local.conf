# Local setup: three Agent A replicas run as Docker containers (agent-a-1, agent-a-2,
# agent-a-3) on the private network `dji-net`, together with this gateway.
# nginx reaches them by container name (Docker's internal DNS). See run_local.sh.

include /etc/nginx/gateway/gateway.common.conf;

upstream agent_a {
    # Shared memory: all nginx worker processes share the balancing state and the
    # "replica is down" information (without it each worker balances on its own).
    zone agent_a 64k;
    least_conn;
    # passive health check: 1 failed connection → replica skipped for 10 s
    server agent-a-1:8000 max_fails=1 fail_timeout=10s;
    server agent-a-2:8000 max_fails=1 fail_timeout=10s;
    server agent-a-3:8000 max_fails=1 fail_timeout=10s;
    keepalive 32;
}

server {
    include /etc/nginx/gateway/gateway.server.conf;
}

# Internal stub_status endpoint for the Prometheus nginx exporter (port 8081, not published)
include /etc/nginx/gateway/gateway.status.conf;
