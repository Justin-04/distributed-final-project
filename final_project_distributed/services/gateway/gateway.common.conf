# ─────────────────────────────────────────────────────────────────────────────
# API gateway — shared settings (included by nginx.conf and nginx.local.conf)
#
# Single entry point in front of the Agent A replicas:
#   * load balancing (least_conn: LLM requests last seconds, so "fewest active
#     requests" spreads load better than round robin)
#   * failover: a replica that refuses connections is marked down for 10 s and the
#     request is retried on the next replica (only if it was not sent yet)
#   * edge protection: per-IP rate limit, body size limit, timeouts
#   * observability: request ID propagated to Agent A, X-Upstream header shows
#     which replica answered
# ─────────────────────────────────────────────────────────────────────────────

# 20 requests/s per client IP, bursts of 40 (the per-user chat limit stays in Agent A)
limit_req_zone $binary_remote_addr zone=per_ip:10m rate=20r/s;
limit_req_status 429;

# Correlation ID: keep the client's X-Request-ID or generate one
map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

log_format gateway '$remote_addr [$time_local] "$request" $status '
                   'upstream=$upstream_addr up_status=$upstream_status '
                   'rt=$request_time urt=$upstream_response_time rid=$req_id';

# Machine-readable log for the Prometheus log exporter. Fields are separated by "|"
# because $upstream_addr contains ", " when a request was retried on another replica
# ("…:8000, …:8000"), which a space-separated parser would split. The last field is the
# replica's name, taken from the X-Instance header it returns ("-" = answered by nginx).
log_format gateway_metrics '$remote_addr|$time_local|$request|$status|$body_bytes_sent|'
                           '$upstream_addr|$request_time|$upstream_http_x_instance';
