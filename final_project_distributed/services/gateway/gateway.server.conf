# API gateway — server block body (included inside `server { ... }`)

listen 8080;
access_log /dev/stdout gateway;
# read by the Prometheus log exporter (shared volume)
access_log /var/log/gateway/metrics.log gateway_metrics;
error_log /dev/stderr warn;

# Replicas' Prometheus endpoints are scraped directly, never through the public gateway
location = /metrics {
    return 404;
}

client_max_body_size 60M;          # PDF uploads (base64) go through the gateway

# Gateway's own liveness probe (does not touch the replicas)
location = /gateway/health {
    default_type application/json;
    return 200 '{"status":"healthy","service":"gateway"}';
}

location / {
    limit_req zone=per_ip burst=40 nodelay;

    proxy_pass http://agent_a;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID $req_id;

    # Failover: try the next replica when one is down. POST requests are only
    # retried if they never reached a replica (nginx default), so a chat request
    # is never executed twice.
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 3;
    proxy_connect_timeout 2s;

    # LLM answers and PDF uploads can take minutes; chat streaming (SSE) must not be buffered
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
    proxy_request_buffering on;

    add_header X-Upstream $upstream_addr always;      # replica address(es) tried
    # (the replica's own X-Instance header, e.g. agent-a-2, is passed through)
    add_header X-Request-ID $req_id always;
}
