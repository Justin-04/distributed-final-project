# Cloud (docker-compose): Agent A runs as N replicas of the `agent-system-a` service.
# Docker's DNS returns one address per replica; nginx balances across all of them.

include /etc/nginx/gateway/gateway.common.conf;

upstream agent_a {
    zone agent_a 64k;   # balancing + failure state shared by all nginx workers
    least_conn;
    # Re-resolve the service name every 10 s through Docker's embedded DNS (127.0.0.11).
    # Without `resolve`, nginx looks the name up ONCE at start-up: replicas added with
    # `docker compose up --scale agent-system-a=N` received no traffic, and removed ones
    # stayed in the pool, until the gateway was reloaded. (`resolve` in upstreams is
    # available in open-source nginx since 1.27.3; this image runs 1.27.x.)
    resolver 127.0.0.11 valid=10s ipv6=off;
    server agent-system-a:8000 resolve max_fails=1 fail_timeout=10s;
    keepalive 32;
}

server {
    include /etc/nginx/gateway/gateway.server.conf;
}

# Internal stub_status endpoint for the Prometheus nginx exporter
include /etc/nginx/gateway/gateway.status.conf;
