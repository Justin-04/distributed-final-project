# Internal status endpoint for nginx-prometheus-exporter (active / reading / writing /
# waiting connections, total requests). Port 8081 is not published outside Docker.
server {
    listen 8081;
    access_log off;
    location = /stub_status {
        stub_status;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }
}
